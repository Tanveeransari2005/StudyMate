
name: studymate
description: "StudyMate - Your little study companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  file_picker: 8.1.7
  path_provider: ^2.1.5
  syncfusion_flutter_pdfviewer: ^33.2.13
  pdfrx: ^2.2.24
  flutter_local_notifications: 17.2.4
  timezone: 0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 24
